name: Build Windows CUDA

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Windows x64 CUDA
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.1'
          method: network
          use-github-cache: true
          use-local-cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "=== CMake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== MSVC ==="
          cl

          Write-Host ""
          Write-Host "=== CUDA ==="
          nvcc --version

          Write-Host ""
          Write-Host "=== CUDA_PATH ==="
          Write-Host $env:CUDA_PATH

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DGGML_CUDA=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Show Release files
        shell: pwsh
        run: |
          Write-Host "=== build\Release ==="

          if (-not (Test-Path "build\Release")) {
            Write-Error "build\Release does not exist"
            exit 1
          }

          Get-ChildItem "build\Release" -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Collect complete Release directory
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Release")) {
            Write-Error "build\Release does not exist"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item `
            "build\Release\*" `
            "package\" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "=== Package contents ==="

          Get-ChildItem "package" -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "pockettts-windows-cuda.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pockettts-windows-cuda
          path: pockettts-windows-cuda.zip
          if-no-files-found: error
