name: Build Windows CUDA

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Windows x64 CUDA
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.1'
          method: network
          use-github-cache: true
          use-local-cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "=== CMake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== Ninja ==="
          ninja --version

          Write-Host ""
          Write-Host "=== MSVC ==="
          cl

          Write-Host ""
          Write-Host "=== CUDA ==="
          nvcc --version

          Write-Host ""
          Write-Host "=== CUDA_PATH ==="
          Write-Host $env:CUDA_PATH

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DGGML_CUDA=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Find binaries
        shell: pwsh
        run: |
          Write-Host "=== Executables ==="

          Get-ChildItem build -Recurse -File |
            Where-Object {
              $_.Name -eq "pocket-tts.exe" -or
              $_.Name -eq "tts-server.exe"
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $pocket = Get-ChildItem build -Recurse -Filter "pocket-tts.exe" |
            Select-Object -First 1

          $server = Get-ChildItem build -Recurse -Filter "tts-server.exe" |
            Select-Object -First 1

          if (-not $pocket) {
            Write-Error "pocket-tts.exe was not found"
            exit 1
          }

          if (-not $server) {
            Write-Error "tts-server.exe was not found"
            exit 1
          }

          Copy-Item $pocket.FullName package/pocket-tts.exe
          Copy-Item $server.FullName package/tts-server.exe

          Write-Host ""
          Write-Host "=== Package ==="
          Get-ChildItem package

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package/* `
            -DestinationPath pockettts-windows-cuda.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pockettts-windows-cuda
          path: pockettts-windows-cuda.zip
          if-no-files-found: error
